<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EntrySense — Real-Time Parking Occupancy</title>
    <meta
      name="description"
      content="Real-time parking lot occupancy PWA translating live vehicle ingress and egress signals into a calm, glanceable mobile view."
    />
    <meta property="og:title" content="EntrySense — Real-Time Parking Occupancy" />
    <meta
      property="og:description"
      content="Real-time parking lot occupancy PWA translating live vehicle ingress and egress signals into a calm, glanceable mobile view."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F5F5F7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EntrySense" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('entrysense-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved || saved === 'system') && prefersDark;
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#09090B');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--surface-canvas)] text-[var(--ink-primary)] antialiased selection:bg-[var(--accent-soft)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
